# Fetches fresh events every 6 hours and publishes the calendar as a website
# (GitHub Pages). It can also be started by hand from the repository's
# "Actions" tab -> "Update events and publish website" -> "Run workflow".
name: Update events and publish website

on:
  schedule:
    - cron: "17 */6 * * *"     # every 6 hours (times are UTC)
  workflow_dispatch: {}        # "Run workflow" button
  push:
    branches: [main]           # republish whenever you change something

permissions:
  contents: write              # to save the refreshed events.json back to the repository
  pages: write                 # to publish the website
  id-token: write

concurrency:
  group: update-and-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest events
        # Skip the slow fetch when this run was started by a normal edit/upload.
        if: github.event_name != 'push'
        run: python3 scraper.py

      - name: Save refreshed events to the repository
        if: github.event_name != 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json events.js calendar/
          git diff --cached --quiet || git commit -m "Update events"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  publish:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
